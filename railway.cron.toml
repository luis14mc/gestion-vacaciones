# Servicio cron de Railway — asignación mensual por día de ingreso.
#
# Crear un SEGUNDO servicio en el mismo proyecto Railway apuntando a este repo
# y en Settings → Config file path: /railway.cron.toml
#
# Compartir DATABASE_URL con el servicio Postgres de Railway.
# Horario UTC 13:00 ≈ 07:00 America/Tegucigalpa (sin horario de verano en HN).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.cron"

[deploy]
startCommand = "pnpm cron:asignacion-mensual"
cronSchedule = "0 13 * * *"
restartPolicyType = "NEVER"
